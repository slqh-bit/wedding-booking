name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hafalati
          POSTGRES_PASSWORD: hafalati
          POSTGRES_DB: hafalati
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hafalati -d hafalati"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Matches the postgres service above.
      DATABASE_URL: postgresql://hafalati:hafalati@localhost:5432/hafalati?schema=public
      # Test-only secrets (the app needs ≥16 chars; never used against real data).
      JWT_ACCESS_SECRET: ci-access-secret-0000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-000000000000000
      NODE_ENV: test
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @hafalati/api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @hafalati/api exec prisma db seed

      - name: Build all packages
        run: pnpm -r build

      - name: Run API tests
        run: pnpm --filter @hafalati/api test
